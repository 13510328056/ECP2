<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>管理员登录 - GH Elite 管理系统</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        body { background: linear-gradient(135deg, #006B3F 0%, #004d2e 100%); min-height: 100vh; display: flex; align-items: center; justify-center: center; }
        .mobile-container { width: 375px; height: 812px; margin: 0 auto; background: white; position: relative; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border-radius: 40px; }
    </style>
</head>
<body>
<div class="mobile-container p-8 flex flex-col">
<div class="mt-20 mb-12 text-center">
<div class="mb-6">
<img alt="Li's Industrial Mart" class="h-24 w-auto mx-auto" src="https://modao.cc/agent-py/workspace/6a1ab2152b1d8246008be26b/ghana-store_v6.html/logo.svg"/>
</div>
<h1 class="text-2xl font-black text-gray-900">Li's Industrial Mart</h1>
<p class="text-gray-400 text-sm mt-2">后台管理系统</p>
</div>
<div class="space-y-6">
<div class="space-y-2">
<label class="text-xs font-bold text-gray-400 uppercase tracking-widest ml-1">管理员账号</label>
<div class="relative">
<iconify-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl" icon="mdi:email-outline"></iconify-icon>
<input class="w-full h-14 bg-gray-50 rounded-2xl pl-12 pr-4 outline-none border-2 border-transparent focus:border-[#F7B500] transition-all text-sm" placeholder="admin@ghelite.com" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="text-xs font-bold text-gray-400 uppercase tracking-widest ml-1">登录密码</label>
<div class="relative">
<iconify-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl" icon="mdi:lock-outline"></iconify-icon>
<input class="w-full h-14 bg-gray-50 rounded-2xl pl-12 pr-12 outline-none border-2 border-transparent focus:border-[#F7B500] transition-all text-sm" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
<iconify-icon class="text-xl" icon="mdi:eye-outline"></iconify-icon>
</button>
</div>
</div>
<div class="flex items-center justify-between px-1">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-4 h-4 rounded border-gray-300 text-[#006B3F] focus:ring-[#006B3F]" type="checkbox"/>
<span class="text-xs text-gray-500">记住我</span>
</label>
<a class="text-xs text-[#006B3F] font-bold" href="#">忘记密码?</a>
</div>
<a class="block w-full h-14 bg-[#006B3F] text-white rounded-2xl font-bold flex items-center justify-center shadow-lg shadow-green-100 hover:bg-[#005a35] transition-colors mt-4" href="admin-dashboard.html">
                立即登录
            </a>
</div>
<div class="mt-auto pb-12 text-center">
<p class="text-[10px] text-gray-400 uppercase tracking-widest">© 2024 Ghana Elite Store Management</p>
<div class="flex justify-center gap-4 mt-4">
<a class="text-xs text-gray-400 flex items-center gap-1" href="home.html">
<iconify-icon icon="mdi:arrow-left"></iconify-icon>
                    返回商城首页
                </a>
</div>
</div>
</div>
</body>
</html>
