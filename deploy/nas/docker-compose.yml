version: '3.8'

services:
  ecp2:
    image: nginx:alpine
    container_name: ecp2-mart
    ports:
      - "8080:80"
    volumes:
      # 挂载构建好的静态文件到 nginx 目录
      - ./dist:/usr/share/nginx/html:ro
      # 挂载自定义 nginx 配置
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
